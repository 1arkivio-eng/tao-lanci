name: lanci-subnet
on:
  schedule:
    - cron: "*/5 * * * *"    # ogni 5 minuti in teoria, in pratica GitHub ne salta molti; repo pubblico = minuti gratuiti
    - cron: "41 4 * * 1"     # ogni lunedì: tiene vivo il calendario (GitHub lo spegne dopo 60 giorni senza attività)
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda una notifica di prova"
        type: boolean
        default: false
permissions:
  actions: write
  contents: read
concurrency:
  group: lanci
  cancel-in-progress: false
jobs:
  controllo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Ripristina stato
        uses: actions/cache/restore@v5
        with:
          path: stato_lanci.json
          key: lanci-${{ github.run_id }}
          restore-keys: lanci-
      - name: Controllo lanci sulla catena (solo lettura)
        id: controllo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          PROVA: ${{ inputs.prova }}
          TZ: Europe/Rome
          DURATA_MAX: "540"   # se una subnet può aprire a momenti: controllo ogni 20 s per ~9 minuti, poi passa al giro dopo
          PASSO: "20"
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "Manca NTFY_TOPIC (segreto o variabile)"; exit 1; fi
          python3 lanci.py
      - name: Salva stato
        if: always()
        uses: actions/cache/save@v5
        with:
          path: stato_lanci.json
          key: lanci-${{ github.run_id }}
      - name: Giro successivo subito (solo se una subnet può aprire a momenti)
        if: steps.controllo.outputs.catena == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lanci.yml -R "${{ github.repository }}" --ref main
      - name: Mantieni attivo il calendario
        if: github.event.schedule == '41 4 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/lanci.yml/enable"
